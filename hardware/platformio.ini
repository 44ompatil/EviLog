; EviLog Hardware Firmware — PlatformIO Configuration
; Target: ESP32 DevKit V1 (ESP32-WROOM-32)

[platformio]
default_envs = esp32dev
description = EviLog Evidence Tracking Hardware Firmware

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
  miguelbalboa/MFRC522 @ ^1.4.11
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  madhephaestus/ESP32Servo @ ^0.13.0

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -I include

; ---- Individual component test environments ----

[env:test_rfid]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
test_framework = unity
test_filter  = test_rfid
build_flags  = -I include
lib_deps     = miguelbalboa/MFRC522 @ ^1.4.11

[env:test_lcd]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
test_framework = unity
test_filter  = test_lcd
lib_deps     = marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

[env:test_servo]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
test_framework = unity
test_filter  = test_servo
lib_deps     = madhephaestus/ESP32Servo @ ^0.13.0

[env:test_buzzer]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
test_framework = unity
test_filter  = test_buzzer

[env:test_backend]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
test_framework = unity
test_filter  = test_backend

