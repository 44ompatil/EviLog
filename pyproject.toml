[project]
name = "evilog"
version = "0.1.0"
description = "EviLog prototype project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "mongomock>=4.1.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "opencv-contrib-python>=4.8.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pymongo>=4.5.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.23.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
